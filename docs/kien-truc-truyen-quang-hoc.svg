<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc truyền dữ liệu quang học Decimen</title>
  <desc id="desc">Infographic mô tả tệp hoặc văn bản được đóng gói, mã Fountain, phát qua QR động, thu bằng camera, giải mã WASM và xác minh SHA-256.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1b30"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.34" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 40px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:.2px}
      .subtitle{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .stage{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#67e8f9;letter-spacing:2.2px}
      .box-title{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .body{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .small{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .chip{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0;letter-spacing:.3px}
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1435" cy="110" r="220" fill="#0e7490" opacity="0.08"/>
  <circle cx="120" cy="820" r="260" fill="#7c3aed" opacity="0.07"/>

  <text x="90" y="82" class="title">DECIMEN OPTICAL TRANSFER</text>
  <text x="90" y="118" class="subtitle">Từ byte dữ liệu đến ánh sáng — và trở lại byte dữ liệu đã xác minh</text>
  <g transform="translate(1278 55)">
    <rect width="230" height="54" rx="27" fill="#0f253d" stroke="#1e3a5f"/>
    <circle cx="29" cy="27" r="8" fill="#22c55e" filter="url(#glow)"/>
    <text x="50" y="33" class="chip">KHÔNG KÊNH MẠNG</text>
  </g>

  <path d="M190 418 C450 280 560 545 800 410 C1040 275 1160 545 1410 410 L1410 570 C1160 700 1040 438 800 575 C560 712 450 445 190 580 Z" fill="url(#beam)"/>

  <g transform="translate(75 185)">
    <rect width="320" height="510" rx="28" fill="#0f1f34" stroke="#1e3a5f" stroke-width="2"/>
    <text x="30" y="46" class="stage">01 · NGUỒN &amp; ĐÓNG GÓI</text>
    <g transform="translate(30 78)">
      <rect width="260" height="112" rx="18" fill="#132945"/>
      <path d="M28 25 h48 l20 20 v44 h-68 z" fill="none" stroke="#60a5fa" stroke-width="4"/>
      <path d="M76 25 v22 h20" fill="none" stroke="#60a5fa" stroke-width="4"/>
      <text x="122" y="49" class="box-title">Tệp / văn bản</text>
      <text x="122" y="77" class="body">Tối đa 64 MB</text>
    </g>
    <path d="M160 204 v38" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(30 250)">
      <rect width="260" height="176" rx="18" fill="#132945"/>
      <text x="24" y="38" class="box-title">Container DCF2</text>
      <rect x="24" y="58" width="74" height="28" rx="14" fill="#1d4ed8"/><text x="42" y="77" class="chip">MIME</text>
      <rect x="106" y="58" width="68" height="28" rx="14" fill="#6d28d9"/><text x="124" y="77" class="chip">gzip</text>
      <rect x="182" y="58" width="55" height="28" rx="14" fill="#0f766e"/><text x="194" y="77" class="chip">Tên</text>
      <text x="24" y="119" class="body">SHA-256 · kích thước</text>
      <text x="24" y="148" class="small">Header 49 byte + payload</text>
    </g>
  </g>

  <g transform="translate(445 185)">
    <rect width="320" height="510" rx="28" fill="#111d32" stroke="#4338ca" stroke-width="2"/>
    <text x="30" y="46" class="stage">02 · MÃ HÓA FOUNTAIN</text>
    <g transform="translate(30 82)">
      <rect width="260" height="344" rx="18" fill="#171f3b"/>
      <text x="24" y="42" class="box-title">LT Encoder</text>
      <text x="24" y="72" class="body">Chia K khối nguồn</text>
      <g transform="translate(24 94)">
        <rect width="44" height="44" rx="8" fill="#2563eb"/><text x="14" y="28" class="chip">x₁</text>
        <rect x="55" width="44" height="44" rx="8" fill="#7c3aed"/><text x="69" y="28" class="chip">x₂</text>
        <rect x="110" width="44" height="44" rx="8" fill="#0891b2"/><text x="124" y="28" class="chip">x₃</text>
        <rect x="165" width="44" height="44" rx="8" fill="#0f766e"/><text x="178" y="28" class="chip">xₖ</text>
      </g>
      <text x="24" y="178" class="body">Robust soliton chọn bậc d</text>
      <text x="24" y="208" class="body">PRNG(session, seq) chọn khối</text>
      <g transform="translate(24 230)">
        <rect width="212" height="66" rx="14" fill="#312e81" stroke="#818cf8"/>
        <text x="25" y="29" class="box-title">yₛ = x₁ ⊕ x₃ ⊕ xₖ</text>
        <text x="25" y="52" class="small">Tổ hợp mới cho mỗi seq</text>
      </g>
    </g>
  </g>

  <g transform="translate(815 185)">
    <rect width="320" height="510" rx="28" fill="#172033" stroke="#d97706" stroke-width="2"/>
    <text x="30" y="46" class="stage">03 · KÊNH QUANG HỌC</text>
    <g transform="translate(30 80)">
      <rect width="260" height="346" rx="18" fill="#222235"/>
      <g transform="translate(24 24)">
        <rect width="212" height="162" rx="14" fill="#f8fafc"/>
        <g fill="#111827">
          <rect x="17" y="17" width="48" height="48"/><rect x="24" y="24" width="34" height="34" fill="#f8fafc"/><rect x="32" y="32" width="18" height="18"/>
          <rect x="147" y="17" width="48" height="48"/><rect x="154" y="24" width="34" height="34" fill="#f8fafc"/><rect x="162" y="32" width="18" height="18"/>
          <rect x="17" y="97" width="48" height="48"/><rect x="24" y="104" width="34" height="34" fill="#f8fafc"/><rect x="32" y="112" width="18" height="18"/>
          <rect x="84" y="22" width="13" height="13"/><rect x="105" y="22" width="13" height="34"/><rect x="82" y="52" width="34" height="13"/>
          <rect x="79" y="80" width="13" height="13"/><rect x="101" y="76" width="34" height="13"/><rect x="122" y="95" width="13" height="34"/>
          <rect x="76" y="109" width="34" height="13"/><rect x="83" y="131" width="13" height="13"/><rect x="109" y="127" width="13" height="18"/>
          <rect x="150" y="79" width="13" height="13"/><rect x="171" y="76" width="24" height="13"/><rect x="145" y="105" width="13" height="34"/><rect x="168" y="111" width="27" height="13"/>
        </g>
      </g>
      <text x="24" y="223" class="box-title">QR động</text>
      <text x="24" y="251" class="body">Header 20 byte + block LT</text>
      <path d="M25 286 h190" stroke="#fbbf24" stroke-width="5" stroke-dasharray="7 10"/>
      <text x="24" y="321" class="small">Nhòe · rung · mất nét · mất khung</text>
    </g>
  </g>

  <g transform="translate(1185 185)">
    <rect width="340" height="510" rx="28" fill="#102532" stroke="#0891b2" stroke-width="2"/>
    <text x="30" y="46" class="stage">04 · THU &amp; KHÔI PHỤC</text>
    <g transform="translate(30 80)">
      <rect width="280" height="346" rx="18" fill="#12303b"/>
      <g transform="translate(22 25)">
        <rect width="74" height="56" rx="12" fill="none" stroke="#22d3ee" stroke-width="4"/>
        <circle cx="37" cy="28" r="14" fill="none" stroke="#22d3ee" stroke-width="4"/>
        <path d="M74 17 l25-13 v48 l-25-13" fill="none" stroke="#22d3ee" stroke-width="4"/>
        <text x="120" y="25" class="box-title">Camera</text>
        <text x="120" y="51" class="small">Ảnh mới nhất</text>
      </g>
      <path d="M140 96 v34" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <g transform="translate(22 139)">
        <rect width="236" height="60" rx="14" fill="#164e63"/>
        <text x="18" y="27" class="box-title">ZXing · WASM</text>
        <text x="18" y="49" class="small">Pool Web Worker</text>
      </g>
      <path d="M140 205 v30" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <g transform="translate(22 243)">
        <rect width="236" height="76" rx="14" fill="#0f766e"/>
        <text x="18" y="31" class="box-title">LT Decoder</text>
        <text x="18" y="56" class="small">Peeling → FNV → SHA-256 ✓</text>
      </g>
    </g>
  </g>

  <path d="M398 440 h40" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M768 440 h40" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1138 440 h40" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(75 752)">
    <rect width="1450" height="86" rx="22" fill="#0a1728" stroke="#1e3a5f"/>
    <text x="32" y="34" class="box-title">Nguyên tắc chịu mất khung</text>
    <text x="32" y="63" class="body">Bộ thu không cần đúng khung hay đúng thứ tự — chỉ cần đủ tổ hợp độc lập để giải K khối nguồn.</text>
    <g transform="translate(1090 18)">
      <rect width="324" height="50" rx="25" fill="#172554"/>
      <text x="24" y="31" class="chip">MẤT KHUNG → CHỈ TĂNG THỜI GIAN</text>
    </g>
  </g>
  <text x="80" y="875" class="small">Tài liệu kỹ thuật tiếng Việt · Base27-CVNSS · Mã nguồn gốc © 2026 BashAlarmist · MIT</text>
</svg>
